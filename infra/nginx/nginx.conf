# web-os reverse proxy — local dev config
#
# Serves two purposes simultaneously, deliberately built as one piece of
# infrastructure rather than two:
#   1. TLS termination (Tier 1, item 1) — browsers talk HTTPS to this
#      proxy; it talks plain HTTP to the backend services on your local
#      machine/network, which is the standard, normal pattern (TLS
#      termination at the edge, not re-encrypted hop-by-hop internally
#      unless you have a specific reason to need that).
#   2. The foundation for the failover thesis (item 7) — right now this
#      just routes to the gateway. Once failover is built, THIS is the
#      file that gains health checks + automatic backup routing, not a
#      separate piece of infrastructure bolted on later.
#
# Upstream is deliberately just the gateway for now — engine-core is not
# wired in as a failover target yet. Adding it here today, before we've
# built and tested real health-check-based failover, would be silently
# taking on the exact risk (behavioral drift between two backends
# serving live traffic) that all the auth-parity testing was meant to
# # guard against.

# Explicit pid/log paths — WITHOUT these, this instance silently shares
# the system default nginx's pid file (/run/nginx.pid) if one is
# installed via `apt install nginx` (which registers a systemd service
# using that same default path). That collision means `systemctl
# stop/restart nginx` can kill THIS custom instance instead of, or along
# with, the system one — confirmed happening during initial setup
# testing. Explicit paths make this instance fully independent of
# whatever the system nginx service is doing.
pid /tmp/web-os-nginx.pid;
error_log /tmp/web-os-nginx-error.log;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server 127.0.0.1:4000;   # services/gateway — the only upstream today
        # server 127.0.0.1:4100 backup;  # services/engine — added once real health-check failover is built (thesis phase)
    }

    # Global, blanket IP-based rate limiting (Tier 1, item 3) —
    # deliberately separate from and complementary to the gateway's own
    # route-specific @Throttle decorators (login lockout, OTP sends,
    # etc.), not a replacement for them. Those protect specific
    # security-sensitive ACTIONS per account; this protects EVERY route
    # — including ones nobody thought to decorate, /healthz, and
    # anything engine-core adds later — from a single IP just flooding
    # the server with requests. Built here, at the edge, so both
    # services get this protection uniformly from one config instead of
    # reimplementing it twice in two languages.
    #
    # $binary_remote_addr keys the limit per client IP (compact form —
    # standard, memory-efficient choice for this). 10m zone size holds
    # roughly 160,000 tracked IPs, generously more than a local-dev or
    # small-scale deployment will ever need.
    #
    # Rate chosen deliberately more generous than any single existing
    # route throttle (the strictest today is 3/60s on OTP-adjacent
    # routes) — this is a BLANKET ceiling meant to catch floods/abuse
    # across all routes combined, not to be the primary defense on any
    # one sensitive route; the app-layer throttles remain that.
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=10r/s;
    limit_req_status 429;

    # Redirect all plain HTTP to HTTPS — nothing should be served
    # unencrypted, including by accident from someone typing the URL
    # without https:// or an old bookmark.
    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        # Modern-only TLS — no TLS 1.0/1.1, which are both deprecated and
        # known-weak. This is a real, current best practice, not
        # excessive caution.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            # burst=20 nodelay: allows a short burst above the steady
            # 10r/s rate (e.g. a page load firing several requests at
            # once) to pass through immediately rather than being
            # queued/delayed, but still hard-rejects (429) once even the
            # burst allowance is exhausted. Without nodelay, nginx would
            # queue+delay burst requests instead of serving them
            # immediately, adding latency to legitimate traffic.
            limit_req zone=global_limit burst=20 nodelay;

            proxy_pass http://backend;

            # Preserve the original request's real info for the backend
            # — without these, the gateway/engine would see every
            # request as coming from nginx itself (127.0.0.1), breaking
            # IP-based rate limiting and audit-log IP addresses.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cookies are set with `Secure` only when NODE_ENV=production
            # today — see cookies.ts / cookies.rs. Once traffic genuinely
            # only ever arrives via this HTTPS proxy, that's the moment
            # to flip is_prod/NODE_ENV so the Secure flag actually gets
            # set — not before, or cookies would silently stop being
            # sent over this same setup during the transition.
        }
    }
}
